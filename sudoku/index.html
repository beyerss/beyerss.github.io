    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <script>
        // Sends Apple devices and Android phones straight to their store. Everyone else sees both links below.
        // APP_STORE_ID is the app's Apple ID from App Store Connect. Without it, Apple's lookup finds it.
        var APP_STORE_ID = "6821428962";
        var BUNDLE_ID = "com.supergoose.sudoku";
        var PLAY_STORE = "https://play.google.com/store/apps/details?id=" + BUNDLE_ID;
        var ua = navigator.userAgent || "";
        // Macs too: the Mac app is the same App Store listing.
        var apple = /iPhone|iPad|iPod|Macintosh/.test(ua);
        var android = /Android/.test(ua);

        function appStore(id) { return "https://apps.apple.com/app/id" + id; }

        // Apple's lookup answers with a call to this function.
        function foundApp(response) {
            var app = response && response.results && response.results[0];
            if (!app) return;
            APP_STORE_ID = String(app.trackId);
            if (apple) location.replace(appStore(APP_STORE_ID));
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (APP_STORE_ID) document.getElementById("app-store").href = appStore(APP_STORE_ID);
        });

        if (android) {
            location.replace(PLAY_STORE);
        } else if (APP_STORE_ID) {
            if (apple) location.replace(appStore(APP_STORE_ID));
        } else {
            document.write('<script src="https://itunes.apple.com/lookup?bundleId=' + BUNDLE_ID + '&callback=foundApp"><\/script>');
        }
    </script>
    <style>
        :root { --blue: #2C5CD0; --deep: #1E3F9A; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            background: linear-gradient(160deg, #3B6FE0, var(--deep));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            text-align: center;
        }
        main { max-width: 440px; }
        img.icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
        h1 { font-size: 32px; margin: 24px 0 8px; }
        p { font-size: 17px; line-height: 1.5; margin: 0 0 28px; opacity: 0.9; }
        /* The official store badges, unmodified. Google's image has its own padding, so it's drawn taller. */
        .stores { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; }
        .stores a { display: block; line-height: 0; }
        .stores img.apple { height: 54px; }
        .stores img.google { height: 80px; }
        footer { margin-top: 32px; font-size: 13px; opacity: 0.75; }
        footer a { color: #fff; }
    </style>

    <main>

        <h1>Sudoku: Notes &amp; Colors</h1>
        <p>A new sudoku every day at every level, with pro notes and colors. No ads, no account, plays offline.</p>
        <div class="stores">
            <a id="app-store" href="https://apps.apple.com/app/id6821428962"><img class="apple" src="https://tools.applemarketingtools.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store"></a>
            <a id="play-store" href="https://play.google.com/store/apps/details?id=com.supergoose.sudoku"><img class="google" src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play"></a>
        </div>
        <footer>
            Made by SuperGoose Software, LLC · <a href="../sudoku-privacy-policy.html">Privacy</a>
        </footer>
    </main>
</body>
